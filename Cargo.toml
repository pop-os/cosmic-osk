[package]
name = "cosmic-osk"
version = "0.1.0"
edition = "2024"

[dependencies]
calloop = "0.14"
calloop-wayland-source = "0.4"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["serde_derive"] }
tokio = { version = "1", features = ["rt"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
xkbcommon = "0.8"
# Internationalization
icu_collator = "1.5"
icu_provider = { version = "1.5", features = ["sync"] }
i18n-embed = { version = "0.15", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.9"
rust-embed = "8"
# reis = { version = "0.7.1", features = ["tokio"] }
reis = { git = "https://github.com/ids1024/reis", features = ["tokio"] }
ashpd = { version = "0.13.13", features = ["tokio", "remote_desktop", "screencast"] }
enumflags2 = "0.7.12"
zbus = "5.19.0"

[dev-dependencies]
tempfile = "3"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = ["multi-window", "tokio", "wayland", "winit"]
